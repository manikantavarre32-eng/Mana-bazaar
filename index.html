<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mana Bazaar</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #2874f0;
      color: white;
      padding: 15px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    .search {
      margin: 15px auto;
      max-width: 600px;
      display: flex;
    }

    .search input {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 5px 0 0 5px;
      font-size: 16px;
    }

    .search button {
      padding: 12px 20px;
      border: none;
      background: #ff9f00;
      color: white;
      border-radius: 0 5px 5px 0;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 15px;
      background: white;
    }

    .category {
      min-width: 100px;
      padding: 12px;
      background: #eee;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
    }

    .products {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .product {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .product-image {
      height: 140px;
      background: #eee;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
    }

    .product h3 {
      margin: 10px 0;
    }

    .price {
      color: #388e3c;
      font-size: 20px;
      font-weight: bold;
    }

    .cart {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      background: #ff9f00;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    footer {
      margin-top: 20px;
      background: #172337;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🛍️ Mana Bazaar</h1>
    <p>Shop Smart • Shop Local</p>

    <div class="search">
      <input type="text" placeholder="Search products...">
      <button>Search</button>
    </div>
  </header>

  <div class="categories">
    <div class="category">📱 Mobiles</div>
    <div class="category">👕 Fashion</div>
    <div class="category">🏠 Home</div>
    <div class="category">💻 Electronics</div>
    <div class="category">🛒 Grocery</div>
  </div>

  <section class="products">

    <div class="product">
      <div class="product-image">📱</div>
      <h3>Smart Phone</h3>
      <p class="price">₹12,999</p>
      <button class="cart" onclick="addToCart('Smart Phone')">
        Add to Cart
      </button>
    </div>

    <div class="product">
      <div class="product-image">👕</div>
      <h3>Men's T-Shirt</h3>
      <p class="price">₹499</p>
      <button class="cart" onclick="addToCart('Men T-Shirt')">
        Add to Cart
      </button>
    </div>

    <div class="product">
      <div class="product-image">🎧</div>
      <h3>Wireless Headphones</h3>
      <p class="price">₹999</p>
      <button class="cart" onclick="addToCart('Wireless Headphones')">
        Add to Cart
      </button>
    </div>

    <div class="product">
      <div class="product-image">⌚</div>
      <h3>Smart Watch</h3>
      <p class="price">₹1,499</p>
      <button class="cart" onclick="addToCart('Smart Watch')">
        Add to Cart
      </button>
    </div>

  </section>

  <footer>
    <p>© 2026 Mana Bazaar</p>
    <p>Multi-Vendor Shopping Platform</p>
  </footer>

  <script>
    function addToCart(product) {
      alert(product + " added to cart 🛒");
    }
  </script>

</body>
</html>
